site_name: Внутренняя документация
site_url: https://serjnsk.github.io/trenergram/docs/
repo_url: https://github.com/serjnsk/trenergram
docs_dir: docs

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # Светлая тема без переключателя — как в lovix-docs (DOCS_RULES, п. 1.1:
  # «белая, чистая», без тёмных секций).
  palette:
    scheme: default
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections      # группы в левом меню заголовками, как .sn-grp
    - navigation.top
    - navigation.footer        # карточки «Назад / Далее» внизу
    - toc.follow               # активный пункт TOC подсвечивается при скролле
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra_css:
  - stylesheets/docs.css

nav:
  - Главная: index.md
  - 01 — Обзор продукта: 01-product-overview.md
  - 02 — Функциональные требования: 02-functional-requirements.md
  - 03 — MVP и роадмап: 03-mvp-and-roadmap.md
  - 04 — Конкуренты: 04-competitors.md
  - 05 — Решения и открытые вопросы: 05-decisions.md
  - 06 — Технологический стек: 06-tech-stack.md
  - 07 — Оффлайн-режим: 07-offline-mode.md
  - Прототип ↗: https://serjnsk.github.io/trenergram/prototype/

markdown_extensions:
  - tables
  - admonition
  - attr_list
