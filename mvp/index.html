<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page"><div class="pagewrap">
        <div class="phead" id="pagehead"></div>
        <div id="page"></div>
      </div></div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ ДАШБОРД — что сегодня требует внимания ═══════════ */
function unanswered(){
  const out=[];
  CLIENTS.forEach(c=>c.comments.forEach((cm,i)=>{
    const key=c.id+':'+i;
    if(!cm.reply && !STATE.replied[key]) out.push({c,cm,key});
  }));
  return out;
}
const recentPRs = () => CLIENTS.filter(c=>c.pr && daysBetween(c.pr.at,TODAY)<=7);
const idle       = () => CLIENTS.filter(c=>c.prog && c.last && daysBetween(c.last,TODAY)>=3);
/* Дырка — программа, чей план уже кончился или кончается в пределах недели. */
const gaps        = () => composeQueue().filter(x=>x.runway <= 7).map(x=>x.p);
const noProg       = () => CLIENTS.filter(c=>!c.prog);

function render(){
  const ses = sessionsOn(TODAY);
  const today = scheduleAll(TODAY,TODAY);
  const un = unanswered(), prs = recentPRs(), idl = idle(), gp = gaps(), np = noProg();

  $('#page').innerHTML = `
    <div class="cols4">
      <div class="kpi"><span class="k">${ICON.cal} Занятий сегодня</span><div class="v">${ses.length}</div><div class="d">${today.length} ${plural(today.length,'атлет','атлета','атлетов')} суммарно</div></div>
      <div class="kpi"><span class="k">${ICON.chat} Ждут ответа</span><div class="v ${un.length?'acc':''}">${un.length}</div><div class="d">комментариев без ответа</div></div>
      <div class="kpi"><span class="k">${ICON.star} Рекорды за неделю</span><div class="v">${prs.length}</div><div class="d">новых персональных максимумов</div></div>
      <div class="kpi"><span class="k">${ICON.clock} Простой 3+ дня</span><div class="v ${idl.length?'warn':''}">${idl.length}</div><div class="d">клиентов не появлялись</div></div>
    </div>

    <div class="cols2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start;margin-top:22px">
      <div>
        <div class="sechead"><span class="t">Таймлайн дня</span><span class="ln"></span><span class="n">${ses.length}</span></div>
        <div class="card cb">
          ${timelineHTML(ses, 0, TODAY)}
        </div>

        <div class="sechead"><span class="t">Неделя одним взглядом</span><span class="ln"></span></div>
        <div class="card cb">
          <div class="wk">
            ${weekDays().map(d=>{ const st=dayStats(d), total=st.n+st.gaps;
              return `<a class="${d===TODAY?'today':''}" href="calendar.html">
                <span class="d">${RU[dowMon(d)]}</span>
                <span class="dt">${dm(d)}</span>
                <span class="n">${st.n||'—'}</span>
                <span class="s">${st.n?`${st.athletes} ${plural(st.athletes,'атлет','атлета','атлетов')}`:'отдых'}</span>
                ${st.gaps?`<span class="g">${st.gaps} не сост.</span>`:''}
                ${total?`<span class="b"><i class="on" style="width:${Math.round(st.n/total*100)}%"></i><i class="no" style="width:${Math.round(st.gaps/total*100)}%"></i></span>`:''}
              </a>`; }).join('')}
          </div>
        </div>

        <div class="sechead"><span class="t">Очередь составления</span><span class="ln"></span></div>
        <div class="card cb">
          <div class="q">
            ${composeQueue().map(x=>{
              /* Запас в днях, а не «неделя N из M»: тренеру важно, сколько
                 осталось до того, как клиенты упрутся в пустоту. */
              const lbl = x.runway < 0 ? `кончилась ${-x.runway} ${plural(-x.runway,'день','дня','дней')} назад`
                        : x.runway === 0 ? 'кончается сегодня'
                        : `хватит на ${x.runway} ${plural(x.runway,'день','дня','дней')}`;
              const cls = x.runway < 0 ? 'rm' : x.runway <= 7 ? 'warn' : 'ok';
              return `<div class="r">
                <span class="c">
                  <a class="t" href="constructor.html?client=${x.p.clients[0]}&date=${addDays(x.lastDay,1)}">${esc(x.p.title)}</a>
                  <span class="s">составлено ${x.composed} из ${x.p.days} ${plural(x.p.days,'дня','дней','дней')} · ${x.athletes} ${plural(x.athletes,'атлет','атлета','атлетов')}</span>
                </span>
                <span class="chip ${cls}">${lbl}</span>
                <a class="btn gh sm" href="constructor.html?client=${x.p.clients[0]}&date=${addDays(x.lastDay,1)}">Составить</a>
              </div>`; }).join('')}
          </div>
        </div>
      </div>

      <div>
        <div class="sechead"><span class="t">Требует внимания</span><span class="ln"></span></div>
        <div class="card cb flush">
          <div class="feed">
            ${un.map(({c,cm,key})=>`
              <div class="fitem">
                <span class="av s">${esc(c.ini)}</span>
                <div class="c">
                  <div class="h"><b>${esc(c.n)}</b>${cm.ex?`<span style="font-size:11.5px;color:var(--tx4)">· ${esc(cm.ex)}</span>`:''}</div>
                  <div class="tx">${esc(cm.tx)}</div>
                  <div class="reply"><input placeholder="Ответить…" data-key="${key}" data-cid="${c.id}"><button class="btn gh sm" data-send="${key}" data-cid="${c.id}">Отправить</button></div>
                </div>
              </div>`).join('')}
            ${prs.map(c=>`
              <div class="fitem">
                <span class="av s">${esc(c.ini)}</span>
                <div class="c">
                  <div class="h"><b>${esc(c.n)}</b><span style="font-size:11.5px;color:var(--tx4)">· ${humanDate(c.pr.at)}</span></div>
                  <div class="tx">${esc(PMNAMES[c.pr.ex]||c.pr.ex)} ${c.pr.v} кг — новый максимум (было ${c.pr.prev})</div>
                  <button class="btn gh sm" data-recalc="${c.id}" style="margin-top:8px">Пересчитать проценты</button>
                </div>
              </div>`).join('')}
            ${idl.map(c=>`
              <div class="fitem">
                <span class="av s">${esc(c.ini)}</span>
                <div class="c">
                  <div class="h"><b>${esc(c.n)}</b></div>
                  <div class="tx">Не появлялся ${ago(c.last)}</div>
                  <a class="btn gh sm" href="client.html?id=${c.id}" style="margin-top:8px;display:inline-flex">Открыть профиль</a>
                </div>
              </div>`).join('')}
            ${gp.map(p=>`
              <div class="fitem">
                <span class="av s">${ICON.prog}</span>
                <div class="c">
                  <div class="h"><b>${esc(p.title)}</b></div>
                  <div class="tx">План составлен не до конца — дальше пусто</div>
                  <a class="btn gh sm" href="constructor.html?client=${p.clients[0]}&date=${addDays(composeQueue().find(x=>x.p.id===p.id).lastDay,1)}" style="margin-top:8px;display:inline-flex">Открыть в конструкторе</a>
                </div>
              </div>`).join('')}
            ${np.map(c=>`
              <div class="fitem">
                <span class="av s">${esc(c.ini)}</span>
                <div class="c">
                  <div class="h"><b>${esc(c.n)}</b></div>
                  <div class="tx">Пришёл по приглашению, программа ещё не назначена</div>
                  <a class="btn gh sm" href="client.html?id=${c.id}" style="margin-top:8px;display:inline-flex">Назначить программу</a>
                </div>
              </div>`).join('')}
            ${!un.length && !prs.length && !idl.length && !gp.length && !np.length ? `<div class="empty"><div class="t">Всё под контролем</div><div class="d">Новых сигналов нет</div></div>` : ''}
          </div>
        </div>

      </div>
    </div>`;

  $$('[data-recalc]').forEach(b=>b.onclick=()=>toast('Проценты в назначенных тренировках пересчитаны от нового максимума'));
  $$('[data-send]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.send, cid=b.dataset.cid;
    const input=$(`[data-key="${key}"]`); const v=input.value.trim();
    if(!v) return;
    const c=client(cid), i=+key.split(':')[1];
    c.comments[i].reply=v; STATE.replied[key]=true; saveState();
    toast('Ответ отправлен'); render();
  });
}
render();
initShell({page:'index.html', title:'Дашборд'});
</script>
</body>
</html>
