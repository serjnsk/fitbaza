<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Календарь · Тренерграм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base-trainer.css">
<link rel="stylesheet" href="assets/theme-01-strava.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page"><div class="pagewrap">
        <div class="phead" id="pagehead"></div>
        <div id="page"></div>
      </div></div>
  </div>
</div>
<div class="ov" id="ov"></div>
<script src="assets/data.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/ui.js"></script>
<script>
/* ═══════════ КАЛЕНДАРЬ (CAL-1) ═══════════
   Три уровня, у каждого своя единица и ограниченный объём:

   МЕСЯЦ  — обзор: сколько занятий, сколько атлетов, сколько не составлено.
            Ни одной фамилии. Сетка «все клиенты × месяц» не масштабируется:
            у персонального тренера полсотни индивидуальных программ, и
            схлопывать по программе нечего — в ячейку не влезет ничего.
   ДЕНЬ   — полный разбор списком (не сеткой): день физически ограничен.
            Групповое занятие — одна строка со стопкой атлетов.
   НЕДЕЛЯ — по одному клиенту. «Все × 7 дней» не помещается тем же образом,
            что и месяц, поэтому клиент выбирается явно.

   Выбор клиента — селектом, а не чипами: строка чипов с фамилией каждого
   клиента ломается на тех же полусотне, что и ячейки. */
const V = { mode:'month', cur:TODAY, cli:(CLIENTS.find(c=>c.prog)||CLIENTS[0]).id };

function monthGrid(anchor){
  const d = D(anchor);
  const first = iso(new Date(d.getFullYear(), d.getMonth(), 1));
  const start = addDays(first, -dowMon(first));
  const cells = Array.from({length:42}, (_,i)=>addDays(start,i));
  return `<div class="cal">
    <div class="calhead">${RU.map(w=>`<div>${w}</div>`).join('')}</div>
    <div class="calgrid">
      ${cells.map(date=>{
        const inMonth = date.slice(0,7)===first.slice(0,7);
        const st = dayStats(date);
        const total = st.n + st.gaps;
        return `<div class="cell pick ${!inMonth?'out':''} ${date===TODAY?'today':''}" data-day="${date}">
          <div class="cd">${+date.slice(8,10)}</div>
          ${total ? `
            <div class="dfill">
              <i class="on" style="width:${Math.round(st.n/total*100)}%"></i>
              <i class="no" style="width:${Math.round(st.gaps/total*100)}%"></i>
            </div>
            <div class="dn">${st.n} ${plural(st.n,'занятие','занятия','занятий')}</div>
            <div class="ds">${st.athletes} ${plural(st.athletes,'атлет','атлета','атлетов')}</div>
            ${st.gaps?`<div class="dg">${st.gaps} не составлено</div>`:''}
          ` : `<div class="quiet">отдых</div>`}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function dayView(date){
  const st = dayStats(date);
  return `<div class="card cb">${timelineHTML(st.ses, st.gaps, date)}</div>
    <div class="cols3" style="margin-top:20px">
      <div class="kpi"><span class="k">${ICON.cal} Занятий</span><div class="v">${st.n}</div><div class="d">${st.athletes} ${plural(st.athletes,'атлет','атлета','атлетов')} суммарно</div></div>
      <div class="kpi"><span class="k">${ICON.build} Не составлено</span><div class="v ${st.gaps?'warn':''}">${st.gaps}</div><div class="d">назначений ждут тренировку</div></div>
      <div class="kpi"><span class="k">${ICON.chk} Записали результат</span><div class="v">${st.ses.reduce((a,s)=>a+s.done,0)}</div><div class="d">из ${st.athletes} за день</div></div>
    </div>`;
}

function weekView(anchor, cid){
  const c = client(cid);
  const start = addDays(anchor, -dowMon(anchor));
  const days = Array.from({length:7},(_,i)=>addDays(start,i));
  const pool = c.prog ? scheduleFor(cid, days[0], days[6]) : [];
  if(!c.prog) return `<div class="empty"><div class="t">${esc(c.n)} без программы</div>
    <div class="d">Назначьте программу в карточке клиента</div></div>`;
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:start">
    ${days.map(date=>{
      const evs = pool.filter(e=>e.date===date);
      return `<div class="card ${date===TODAY?'':''}">
        <div class="ch"><span class="t">${RU[dowMon(date)]} · ${dm(date)}</span></div>
        <div class="cb" style="display:flex;flex-direction:column;gap:7px;min-height:120px">
          ${evs.length ? evs.map(e=>`<a class="ev ${e.status==='done'?'done':''}" href="constructor.html?client=${cid}&date=${e.date}"
              style="height:auto;align-items:flex-start;padding:8px;text-decoration:none">
              <span class="k ${e.kind==='warmup'?'warmup':e.kind==='metcon'?'metcon':e.kind==='cooldown'?'cooldown':''}" style="margin-top:5px"></span>
              <span style="flex:1;min-width:0">
                <span style="display:block;font-size:12px;font-weight:600;color:var(--tx1)">${esc(e.title)}</span>
                <span style="display:block;font-size:11px;color:var(--tx4);margin-top:2px">день ${e.day}${e.draft?' · <b style="color:var(--warn)">черновик</b>':''}</span>
              </span></a>`).join('')
            : `<span style="font-size:11.5px;color:var(--tx4)">Отдых</span>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function periodTitle(){
  const d = D(V.cur);
  if(V.mode==='month') return MONTHS_N[d.getMonth()] + ' ' + d.getFullYear();
  if(V.mode==='day')   return humanDate(V.cur);
  const s = addDays(V.cur, -dowMon(V.cur));
  return dm(s) + ' – ' + dm(addDays(s,6));
}

function render(){
  $('#page').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <div class="filters">
        <button data-mode="month" class="${V.mode==='month'?'on':''}">Месяц</button>
        <button data-mode="day"   class="${V.mode==='day'?'on':''}">День</button>
        <button data-mode="week"  class="${V.mode==='week'?'on':''}">Неделя</button>
      </div>
      <button class="iact" id="pPrev">${ICON.back}</button>
      <button class="iact" id="pNext">${ICON.arr}</button>
      <button class="btn gh sm" id="pToday">Сегодня</button>
      <div style="font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:-.01em">${periodTitle()}</div>
      <span class="sp" style="flex:1"></span>
      ${V.mode==='week' ? `<label class="forw"><span>клиент</span>
        <select id="cli">${CLIENTS.map(c=>`<option value="${c.id}" ${c.id===V.cli?'selected':''}>${esc(c.n)}</option>`).join('')}</select>
      </label>` : ''}
    </div>

    ${V.mode==='month' ? monthGrid(V.cur) : V.mode==='day' ? dayView(V.cur) : weekView(V.cur, V.cli)}

    ${V.mode==='month' ? `<div class="legend">
      <span><i style="background:var(--acc)"></i> Составлено</span>
      <span><i style="background:var(--line2)"></i> Не составлено</span>
    </div>
    <div class="hint">Месяц показывает состояние дня, а не его содержание: имена и тренировки — на экране дня. Клик по дню открывает его.</div>` : ''}`;

  $$('.filters [data-mode]').forEach(b=>b.onclick=()=>{ V.mode=b.dataset.mode; render() });
  $$('[data-day]').forEach(el=>el.onclick=()=>{ V.cur=el.dataset.day; V.mode='day'; render() });
  const sel=$('#cli'); if(sel) sel.onchange=e=>{ V.cli=e.target.value; render() };
  $('#pToday').onclick=()=>{ V.cur=TODAY; render() };
  const step = back => {
    const d=D(V.cur), k = back?-1:1;
    V.cur = V.mode==='month' ? iso(new Date(d.getFullYear(),d.getMonth()+k,1))
          : V.mode==='day'   ? addDays(V.cur,k)
          :                    addDays(V.cur,7*k);
    render();
  };
  $('#pPrev').onclick=()=>step(true);
  $('#pNext').onclick=()=>step(false);
}
render();
initShell({page:'calendar.html', title:'Календарь'});
</script>
</body>
</html>
